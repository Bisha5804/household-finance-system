<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Household Finance Advisor</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
        :root {
            --navy:   #0f2744;
            --teal:   #0d9488;
            --teal-l: #14b8a6;
            --sky:    #e0f2fe;
            --mist:   #f0fdfa;
            --white:  #ffffff;
            --ink:    #1e293b;
            --slate:  #64748b;
            --border: #cbd5e1;
        }
 
        body {
            min-height: 100vh;
            background: var(--navy);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Sans', sans-serif;
            overflow: hidden;
            position: relative;
        }
 
        /* Animated mesh background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 70% 60% at 15% 20%, rgba(13,148,136,.35) 0%, transparent 60%),
                radial-gradient(ellipse 50% 50% at 85% 75%, rgba(20,184,166,.22) 0%, transparent 55%),
                radial-gradient(ellipse 40% 60% at 60% 10%, rgba(56,189,248,.15) 0%, transparent 50%);
            animation: meshPulse 8s ease-in-out infinite alternate;
            pointer-events: none;
        }
 
        @keyframes meshPulse {
            from { opacity: .7; transform: scale(1); }
            to   { opacity: 1;  transform: scale(1.05); }
        }
 
        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: .18;
            pointer-events: none;
            animation: drift 14s ease-in-out infinite alternate;
        }
        .orb-1 { width:380px; height:380px; background: var(--teal);  top:-80px;  left:-80px;  animation-delay:0s; }
        .orb-2 { width:260px; height:260px; background:#38bdf8; bottom:-60px; right:-60px; animation-delay:-4s; }
        .orb-3 { width:180px; height:180px; background: var(--teal-l); top:50%; left:70%;  animation-delay:-8s; }
 
        @keyframes drift {
            from { transform: translate(0,0) scale(1); }
            to   { transform: translate(30px,20px) scale(1.1); }
        }
 
        /* Card */
        .card {
            position: relative;
            width: 480px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 28px;
            padding: 52px 48px 44px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow:
                0 32px 80px rgba(0,0,0,.45),
                inset 0 1px 0 rgba(255,255,255,.15);
            animation: cardIn .7s cubic-bezier(.22,1,.36,1) both;
        }
 
        @keyframes cardIn {
            from { opacity:0; transform: translateY(32px) scale(.97); }
            to   { opacity:1; transform: translateY(0)   scale(1); }
        }
 
        /* Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(13,148,136,.22);
            border: 1px solid rgba(20,184,166,.4);
            color: #5eead4;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            padding: 5px 13px;
            border-radius: 999px;
            margin-bottom: 22px;
        }
        .badge-dot {
            width: 6px; height: 6px;
            background: #2dd4bf;
            border-radius: 50%;
            animation: blink 2s ease-in-out infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
 
        /* Heading */
        .card-title {
            font-family: 'DM Serif Display', serif;
            font-size: 32px;
            color: var(--white);
            line-height: 1.2;
            margin-bottom: 8px;
            letter-spacing: -.02em;
        }
        .card-title span { color: #5eead4; }
 
        .card-sub {
            font-size: 14px;
            color: rgba(255,255,255,.5);
            margin-bottom: 36px;
            line-height: 1.6;
        }
 
        /* Divider */
        .divider {
            height: 1px;
            background: rgba(255,255,255,.08);
            margin-bottom: 32px;
        }
 
        /* Form fields */
        .field {
            margin-bottom: 18px;
            animation: fadeUp .5s ease both;
        }
        .field:nth-child(1) { animation-delay: .1s; }
        .field:nth-child(2) { animation-delay: .2s; }
 
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(12px); }
            to   { opacity:1; transform:translateY(0); }
        }
 
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: rgba(255,255,255,.55);
            margin-bottom: 8px;
        }
 
        .input-wrap {
            position: relative;
        }
 
        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            pointer-events: none;
        }
 
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 14px 16px 14px 42px;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 12px;
            color: var(--white);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color .25s, background .25s, box-shadow .25s;
        }
 
        input::placeholder { color: rgba(255,255,255,.28); }
 
        input:focus {
            border-color: var(--teal-l);
            background: rgba(20,184,166,.1);
            box-shadow: 0 0 0 3px rgba(20,184,166,.18);
        }
 
        input:valid:not(:placeholder-shown) {
            border-color: rgba(20,184,166,.5);
        }
 
        /* Submit button */
        .btn {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: linear-gradient(135deg, #0d9488, #0891b2);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform .2s, box-shadow .2s, filter .2s;
            box-shadow: 0 6px 24px rgba(13,148,136,.4);
            letter-spacing: .02em;
            animation: fadeUp .5s .3s ease both;
        }
 
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(13,148,136,.55);
            filter: brightness(1.08);
        }
        .btn:active { transform: translateY(0); }
 
        .btn-arrow {
            display: inline-block;
            transition: transform .25s;
        }
        .btn:hover .btn-arrow { transform: translateX(4px); }
 
        /* Footer note */
        .card-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: rgba(255,255,255,.25);
            animation: fadeUp .5s .4s ease both;
        }
        .card-footer a { color: rgba(94,234,212,.6); text-decoration: none; }
        .card-footer a:hover { color: #5eead4; }
 
        /* Stats strip at bottom of card */
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1px;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 14px;
            overflow: hidden;
            margin-top: 32px;
            animation: fadeUp .5s .45s ease both;
        }
        .stat {
            background: rgba(255,255,255,.04);
            padding: 14px 10px;
            text-align: center;
        }
        .stat-num {
            font-family: 'DM Serif Display', serif;
            font-size: 20px;
            color: #5eead4;
            display: block;
        }
        .stat-label {
            font-size: 10.5px;
            color: rgba(255,255,255,.38);
            letter-spacing: .04em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
 
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
 
    <div class="card">
        <div class="badge">
            <span class="badge-dot"></span>
            Financial Health Tracker
        </div>
 
        <h1 class="card-title">Manage Your<br><span>Household Finances</span></h1>
        <p class="card-sub">Get a clear picture of your income, expenses,<br>and savings — in minutes.</p>
 
        <div class="divider"></div>
 
        <form action="/family" method="post">
            <div class="field">
                <label for="name">Your Name</label>
                <div class="input-wrap">
                    <span class="input-icon">👤</span>
                    <input type="text" id="name" name="name" placeholder="e.g. Sharma Family" required>
                </div>
            </div>
 
            <div class="field">
                <label for="family_size">Family Size</label>
                <div class="input-wrap">
                    <span class="input-icon">🏠</span>
                    <input type="number" id="family_size" name="family_size" placeholder="Number of members" min="1" max="20" required>
                </div>
            </div>
 
            <button type="submit" class="btn">
                Continue to Family Details
                <span class="btn-arrow">→</span>
            </button>
        </form>
 
        <div class="stats">
            <div class="stat">
                <span class="stat-num">Safe</span>
                <span class="stat-label">Savings &gt;20%</span>
            </div>
            <div class="stat">
                <span class="stat-num">Mod</span>
                <span class="stat-label">Savings 10–20%</span>
            </div>
            <div class="stat">
                <span class="stat-num">Risky</span>
                <span class="stat-label">Savings &lt;10%</span>
            </div>
        </div>
 
        <p class="card-footer">
            B.Tech CSE Project · SGGSIE&T Nanded ·
            <a href="#">Guided by Ms. Smita Rathod</a>
        </p>
    </div>
 
</body>
</html>
